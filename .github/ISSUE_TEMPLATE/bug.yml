name: Bug report / 不具合の報告
description: Something looks wrong or broken. / 表示がおかしい、動かない。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This page is public.** Don't include personal information. / **このページは公開されます。** 個人情報は書かないでください。
  - type: textarea
    id: what
    attributes:
      label: What happened? / 何が起きましたか？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現の手順
  - type: input
    id: device
    attributes:
      label: Device and browser / 端末とブラウザ
      placeholder: iPhone Safari, Windows Chrome, ...
