<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="News" />
    <title>Personal News</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="appbar-row">
        <button id="backButton" class="nav-back" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          <span>戻る</span>
        </button>

        <a id="brand" class="brand" href="#/">
          <span id="today" class="brand-date"></span>
          <span class="brand-title">ニュース</span>
        </a>

        <div class="appbar-actions">
          <button id="shareButton" class="icon-button" type="button" aria-label="共有" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12" /><path d="M8 7l4-4 4 4" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" /></svg>
          </button>
          <button id="searchToggle" class="icon-button" type="button" aria-label="検索" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
          </button>
        </div>
      </div>

      <div id="searchBar" class="search-bar" hidden>
        <div class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
          <input id="keywordInput" type="search" placeholder="キーワード・#タグで検索" enterkeyhint="search" autocomplete="off" />
        </div>
      </div>

      <nav id="tabs" class="tabs" role="tablist" aria-label="カテゴリ"></nav>
    </header>

    <main>
      <section id="listView" class="list-view">
        <div class="list-toolbar">
          <label class="region-chip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18" /></svg>
            <span class="visually-hidden">地域</span>
            <select id="subgroupFilter">
              <option value="">すべての地域</option>
              <option value="日本">日本</option>
              <option value="海外">海外</option>
            </select>
          </label>
          <span id="status" class="status" aria-live="polite">読み込み中…</span>
        </div>

        <div id="newsList" class="news-list"></div>
        <div id="listEnd" class="list-end" aria-hidden="true"></div>
        <button id="moreButton" class="more-button" type="button" hidden>さらに読み込む</button>
      </section>

      <article id="detailView" class="detail-view" hidden></article>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
